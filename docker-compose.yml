version: "3.8"

services:
  # Database Service: PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: python-mastery-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mastery_secure_password_2026
      POSTGRES_DB: mastery_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mastery_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mastery-network

  # Backend API & Execution Runner
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: python-mastery-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:mastery_secure_password_2026@postgres:5432/mastery_db
      JWT_SECRET_KEY: mastery_production_jwt_secret_key_change_me_in_prod
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 10080
      CORS_ORIGINS: '["http://localhost:3000", "http://127.0.0.1:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - mastery-network

  # Frontend Next.js Web App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
    container_name: python-mastery-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mastery-network

volumes:
  postgres_data:
    driver: local

networks:
  mastery-network:
    driver: bridge
